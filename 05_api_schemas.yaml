# JSON-схемы API кредитного конвейера — кейс 2
#
# Как заполнять:
#   1. Не меняй schemas Application (образец).
#   2. Схемы Decision, ExternalRequest, Error заполнены.
#   3. Валидировать: https://www.jsonschemavalidator.net/

openapi: 3.0.3
info:
  title: Fin-Tech Credit Conveyor
  version: "1.0.0"
  description: Приём заявки, эмуляция БКИ/СМЭВ, скоринг, предварительное решение

servers:
  - url: http://localhost:8082

# ---------- ОБРАЗЕЦ: Application, не трогать ----------
components:
  schemas:
    Application:
      type: object
      required: [app_id, age, income, employment, family, amount, term]
      additionalProperties: false
      properties:
        app_id: {type: string, pattern: '^app_[0-9]{4}$'}
        client_id: {type: string, pattern: '^cli_[0-9]{4}$'}
        passport_hash: {type: string, pattern: '^[a-f0-9]{16}$'}
        age: {type: integer, minimum: 18, maximum: 70}
        income: {type: number, exclusiveMinimum: 0}
        employment:
          enum: [employed, self-employed, student, retired, unemployed]
        family:
          enum: [single, married, children]
        amount: {type: number, minimum: 10000, maximum: 5000000}
        term: {type: integer, minimum: 3, maximum: 60}

# ---------- Decision / ExternalRequest / Error ----------
    Decision:
      type: object
      required: [app_id, decision, reason, score, dti]
      properties:
        app_id: {type: string, pattern: '^app_[0-9]{4}$'}
        decision:
          enum: [APPROVED, REFUSED, NEED_MORE_DATA, MANUAL_REVIEW]
        reason: {type: string}
        score: {type: integer, minimum: 0, maximum: 100}
        dti: {type: number, minimum: 0}
        amount_approved: {type: number, nullable: true}
        term_approved: {type: integer, nullable: true}
        rate: {type: number, nullable: true}
        bki:
          type: object
          properties:
            score: {type: integer, minimum: 300, maximum: 850}
            delinquency: {type: boolean}
        smev:
          enum: [MATCH, MISMATCH, TIMEOUT, NOT_CALLED]

    ExternalRequest:
      type: object
      required: [request_id, service, status, latency_ms]
      properties:
        request_id: {type: string, pattern: '^req_[0-9]{4}$'}
        service: {enum: [BKI, SMEV]}
        status: {enum: [SUCCESS, TIMEOUT, ERROR]}
        latency_ms: {type: integer, minimum: 0}
        result: {type: object}

    Error:
      type: object
      required: [error_code, message]
      properties:
        error_code: {type: string}
        message: {type: string}
        retryable: {type: boolean}
        details: {type: object}
# ---------- paths ----------
paths:
  # ---------- ОБРАЗЕЦ: health ----------
  /health:
    get:
      summary: Проверка живости
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {status: {type: string}}}

  # ---------- подача заявки ----------
  /api/v1/applications:
    post:
      summary: Подача кредитной заявки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'
      responses:
        '201':
          description: Заявка создана, решение формируется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '422':
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Заявка с таким app_id уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------- решение по заявке ----------
  /api/v1/applications/{id}/decision:
    get:
      summary: Получить предварительное решение по заявке
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: '^app_[0-9]{4}$'}
      responses:
        '200':
          description: Решение готово
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '404':
          description: Заявка не найдена
        '425':
          description: Решение ещё считается (Too Early)

  # ---------- пересчёт ----------
  /api/v1/applications/{id}/recalculate:
    post:
      summary: Пересчитать решение (например, после обновления данных)
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: '^app_[0-9]{4}$'}
      responses:
        '200':
          description: Решение пересчитано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '409':
          description: Пересчёт невозможен (например, решение уже финальное)